<style>.crt-frame {
    box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9), 0 0 0 20px #0A0A0A;
    border: 2px solid #1A1A1A;
    border-radius: 40px;
    position: relative;
    overflow: hidden
    }
.scanlines {
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 50%, rgba(255, 255, 255, 0.03) 50%);
    background-size: 100% 4px;
    pointer-events: none
    }
.vignette {
    background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.8) 100%);
    pointer-events: none
    }
.static-overlay {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCAm7-xPElqOTlhPsBG93E_l7oCtArrcbKV56gF2gF4RqR2zrcmphjI17rh1FgqRuyBvgRcfIFSty1Otz7Njfd-ykKAHW_M1ju-DIZG7XsDu0ZoE6N9FXcR4U9YCZw-0LQbsgFR1u5oTFIXUFViBu-47404Ug9PVPOVJ6xXVJ3wBTSV-b6tJnxOvK-EP7itl2CEorkQFN-gkxq-n2qOdv1iOij-WzYzS47bh5tvca4DhvwaBmjNzRsaqq1NT3KUxccfNleUq_pEFjc);
    opacity: 0.05;
    mix-blend-mode: screen
    }
.progress-line {
    height: 1px;
    background-color: #D4AF37;
    box-shadow: 0 0 15px #D4AF37
    }
.screen-curve {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 100%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    z-index: 10;
    pointer-events: none
    }</style>

<body class="bg-deep-obsidian flex items-center justify-center min-h-screen m-0 overflow-hidden">
<!-- Main Loading Container -->
<main class="relative z-50 flex flex-col items-center justify-center w-full h-full max-w-container-max px-margin-mobile md:px-margin-desktop">
<!-- CRT Monitor Aesthetic Container -->
<div class="crt-frame w-full max-w-[800px] aspect-[4/3] bg-panel-black flex flex-col items-center justify-center relative">
<!-- Internal Screen Overlays -->
<div class="absolute inset-0 scanlines z-20"></div>
<div class="absolute inset-0 vignette z-30"></div>
<div class="absolute inset-0 static-overlay z-10"></div>
<div class="screen-curve"></div>
<!-- Content Container -->
<div class="relative z-40 flex flex-col items-center gap-12">
<!-- Brand Identity -->
<div class="flex flex-col items-center gap-2">
<h1 class="font-display-hero text-headline-lg tracking-tighter text-on-surface uppercase opacity-80">
                        TONY
                    </h1>
<div class="w-12 h-[1px] bg-metallic-gold opacity-50"></div>
</div>
<!-- Status Message -->
<div class="flex flex-col items-center gap-6">
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-[0.3em]">
                        WARMING UP...
                    </span>
<!-- Faux Progress Bar -->
<div class="w-64 h-[2px] bg-ghost-gray relative overflow-hidden">
<div class="progress-line absolute top-0 left-0 w-[65%] h-full"></div>
</div>
</div>
<!-- Metadata Faux Terminal -->
<div class="flex flex-col items-center gap-1 opacity-30 mt-8">
<p class="font-label-caps text-[8px] text-on-surface-variant">SIGNAL: STABLE</p>
<p class="font-label-caps text-[8px] text-on-surface-variant">RESOLUTION: 4K LUXE</p>
<p class="font-label-caps text-[8px] text-on-surface-variant">MODEL: T_2024_A_V1</p>
</div>
</div>
<!-- Decorative CRT Elements (Knobs/Labels) -->
<div class="absolute bottom-6 right-10 flex gap-4 opacity-20">
<div class="w-3 h-3 rounded-full border border-on-surface-variant"></div>
<div class="w-3 h-3 rounded-full border border-on-surface-variant"></div>
</div>
<div class="absolute bottom-6 left-10 opacity-20">
<span class="font-label-caps text-[10px] text-on-surface-variant">HIGH FIDELITY</span>
</div>
</div>
<!-- External Branding/Copyright -->
<div class="mt-section-gap flex flex-col items-center gap-4">
<p class="font-label-caps text-label-caps text-on-surface-variant opacity-40">
                © 2024 TONY. ALL RIGHTS RESERVED.
            </p>
</div>
</main>
